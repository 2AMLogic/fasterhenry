[workspace]
resolver = "2"
members = ["fasterhenry", "fasterhenry-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/2AMLogic/fasterhenry"
rust-version = "1.85"

[workspace.dependencies]
nalgebra = { version = "0.34", features = ["serde-serialize"] }
simba = { version = "0.9", features = ["wide"] }
wide = "0.7"
rayon = "1"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
codegen-units = 1
lto = "fat"
