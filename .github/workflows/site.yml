name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/benchmarks.md"
      - "scripts/deploy-site.sh"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/benchmarks.md"
      - "scripts/deploy-site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  schedule:
    # Daily browser tests against the live site, so a broken domain, redirect
    # or deployment is noticed without waiting for the next push.
    - cron: "17 14 * * *"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build site/dist
        run: scripts/deploy-site.sh --no-deploy
      - name: Renderer tests
        run: python3 -m unittest discover -s site
      - name: Check the build output
        run: |
          set -euo pipefail
          test -s site/dist/index.html
          test -s site/dist/about/index.html
          test -s site/dist/validation/index.html
          test -s site/dist/fasthenry-users/index.html
          # rendered docs must not leave relative .md hrefs behind
          if grep -rEq 'href="[^h#][^"]*\.md' site/dist --include=index.html; then
            echo "relative .md href left in rendered pages"; exit 1
          fi
          test -s site/dist/assets/hero-spiral.svg
          test -s site/dist/gallery/index.html
          test -s site/dist/benchmarks/index.html
          test -s site/dist/assets/benchmarks/scaling.svg

  e2e:
    name: Browser tests (local build)
    # pinned: Playwright 1.57 has no browser build for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/e2e/package-lock.json
      - name: Build site/dist
        run: scripts/deploy-site.sh --no-deploy
      - name: Install Playwright
        working-directory: site/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests against site/dist
        working-directory: site/e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-local
          path: site/e2e/test-results
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build, e2e]
    # main only; a pull request never deploys.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          set -euo pipefail
          # The secrets exist (2AMLogic/2am#6593). A missing one is a broken
          # deploy, not a reason to skip: fail so it is noticed.
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; cannot deploy."
            exit 1
          fi
          scripts/deploy-site.sh

  e2e-live:
    name: Browser tests (fasterhenry.org)
    needs: deploy
    # After every deploy from main, and daily on the schedule (where the
    # deploy job is skipped).
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.deploy.result == 'success' || github.event_name == 'schedule')
    # pinned: Playwright 1.57 has no browser build for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/e2e/package-lock.json
      - name: Install Playwright
        working-directory: site/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests against the live site
        working-directory: site/e2e
        env:
          BASE_URL: https://fasterhenry.org
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live
          path: site/e2e/test-results
          retention-days: 7
