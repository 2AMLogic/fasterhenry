name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/deploy-site.sh"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/deploy-site.sh"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build site/dist
        run: scripts/deploy-site.sh --no-deploy
      - name: Renderer tests
        run: python3 -m unittest discover -s site
      - name: Check the build output
        run: |
          set -euo pipefail
          test -s site/dist/index.html
          test -s site/dist/about/index.html
          test -s site/dist/validation/index.html
          test -s site/dist/fasthenry-users/index.html
          # rendered docs must not leave relative .md hrefs behind
          if grep -rEq 'href="[^h#][^"]*\.md' site/dist --include=index.html; then
            echo "relative .md href left in rendered pages"; exit 1
          fi
          test -s site/dist/assets/hero-spiral.svg

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # main only; a pull request never deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (skipped while the token secret is absent)
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not configured; skipping deploy."
            exit 0
          fi
          scripts/deploy-site.sh
