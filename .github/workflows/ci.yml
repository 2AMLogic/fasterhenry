name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-room:
    name: Clean-room check (no FastHenry-derived text)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the MIT RLE license notice appears anywhere
        run: |
          set -euo pipefail
          # The FastHenry/FastCap notice is the fingerprint of copied source.
          if grep -rIl --exclude-dir=.git --exclude-dir=.github --exclude=CONTRIBUTING.md --exclude=README.md \
               -e 'internal, noncommercial purposes' -e 'LICENSEE agrees not to make any copies' . ; then
            echo '::error::MIT RLE FastHenry/FastCap license text found — this project is clean-room; see CONTRIBUTING.md'
            exit 1
          fi
          echo "clean"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace
