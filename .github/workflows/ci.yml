name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-room:
    name: Clean-room check (no FastHenry-derived text)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the MIT RLE license notice appears anywhere
        run: |
          set -euo pipefail
          # The FastHenry/FastCap notice is the fingerprint of copied source.
          if grep -rIl --exclude-dir=.git --exclude-dir=.github --exclude=CONTRIBUTING.md --exclude=README.md \
               -e 'internal, noncommercial purposes' -e 'LICENSEE agrees not to make any copies' . ; then
            echo '::error::MIT RLE FastHenry/FastCap license text found — this project is clean-room; see CONTRIBUTING.md'
            exit 1
          fi
          echo "clean"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace
      # The 2 000-filament budget is defined on ubuntu-latest and only means
      # something optimized, so it is an ignored test run here in release mode.
      - name: performance smoke (2 000 filaments < 10 s, release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p fasterhenry --test perf_smoke -- --ignored --nocapture --test-threads=1
      # The validation oracle regenerates the PyPEEC reference here (nothing
      # generated is committed) and asserts the test did NOT take its skip
      # path. Linux legs only: pypeec wheels are not needed elsewhere.
      - name: validation reference (PyPEEC) + assert it did not skip
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pypeec-venv
          /tmp/pypeec-venv/bin/pip install -q pypeec==5.8.0
          /tmp/pypeec-venv/bin/python tools/pypeec_reference.py --out target/pypeec_reference.json
          FASTERHENRY_PYPEEC_REFERENCE=target/pypeec_reference.json \
            cargo test -p fasterhenry --test spiral_validation -- --nocapture \
            | tee target/spiral-validation.log
          if grep -q "SKIPPED" target/spiral-validation.log; then
            echo "::error::spiral_validation skipped although the reference was generated"
            exit 1
          fi
      # The MAT v4 export round-trips through scipy.io.loadmat with values
      # identical to the JSON output (structure check lives in the Rust tests).
      - name: output formats (scipy loadmat vs JSON)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cargo run -q -p fasterhenry-cli -- run fasterhenry-cli/tests/data/spiral.inp \
            --freq 1e6 1e9 1 --json target/spiral.json --zc-mat target/spiral.mat
          /tmp/pypeec-venv/bin/python - << 'PYEOF'
          import json
          from scipy.io import loadmat
          result = json.load(open('target/spiral.json'))
          mat = loadmat('target/spiral.mat')
          assert mat['freqs'].flatten().tolist() == result['frequencies_hz']
          for k, z in enumerate(result['impedance_ohm']):
              for i, row in enumerate(z):
                  for j, entry in enumerate(row):
                      got = mat[f'Zc_{k + 1}'][i, j]
                      assert abs(got.real - entry['re']) <= 1e-12 * abs(entry['re']) + 1e-30
                      assert abs(got.imag - entry['im']) <= 1e-12 * abs(entry['im']) + 1e-30
          print('scipy.io.loadmat round-trip: exact')
          PYEOF
      # The ground-plane PyPEEC gate: slotted-vs-solid differential on
      # both solvers (contact terms cancel), release mode for the 96x64
      # reference grid. ubuntu-latest only; it needs the venv above.
      - name: validation reference (PyPEEC planes) + assert it did not skip
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          /tmp/pypeec-venv/bin/python tools/pypeec_reference.py \
            --fixture plane --voxel-um 5.0 --out target/pypeec_plane.json
          /tmp/pypeec-venv/bin/python tools/pypeec_reference.py \
            --fixture plane-solid --voxel-um 5.0 --out target/pypeec_plane_solid.json
          FASTERHENRY_PYPEEC_PLANE_REFERENCE=target/pypeec_plane.json \
          FASTERHENRY_PYPEEC_PLANE_SOLID_REFERENCE=target/pypeec_plane_solid.json \
            cargo test --release -p fasterhenry --test plane_validation -- --nocapture \
            | tee target/plane-validation.log
          if grep -q "SKIPPED" target/plane-validation.log; then
            echo "::error::plane_validation skipped although the references were generated"
            exit 1
          fi
      # The width-graded skin-effect gate (issue #32): an independent 2-D
      # cross-section solve (numpy only; the venv above has it) against
      # uniform and width-graded filament grids, release mode. Passing is
      # asserted positively: all four reference-backed tests must print their
      # PASSED marker, so a skip on any path cannot look like a pass.
      - name: validation reference (2-D cross-section) + assert all gates ran
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          /tmp/pypeec-venv/bin/python tools/cross_section_reference.py \
            --out "$GITHUB_WORKSPACE/target/cross_section_reference.json"
          FASTERHENRY_CROSS_SECTION_REFERENCE="$GITHUB_WORKSPACE/target/cross_section_reference.json" \
            cargo test --release -p fasterhenry --test width_graded_skin_validation -- --nocapture 2>&1 \
            | tee target/cross-section-validation.log
          passed="$(grep -c "CROSS-SECTION GATE PASSED" target/cross-section-validation.log || true)"
          if [ "$passed" -ne 4 ]; then
            echo "::error::width_graded_skin_validation: $passed of 4 reference gates ran"
            exit 1
          fi

  package:
    name: Package (cargo publish --dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Nothing here uploads anything: every publish command carries --dry-run,
      # and the job has no registry token. The real publish is an operator step.
      - name: Package contents (allowlist, both crates)
        run: |
          set -euo pipefail
          # A published crate carries sources, the manifest, README, LICENSE and
          # CHANGELOG -- plus the files cargo itself generates. Anything else
          # (fixtures, oracle/venv files, .loom/.claude tooling) fails the job.
          allowed='^(\.cargo_vcs_info\.json|Cargo\.lock|Cargo\.toml|Cargo\.toml\.orig|README\.md|LICENSE|CHANGELOG\.md|build\.rs|src/.+\.rs)$'
          for crate in fasterhenry fasterhenry-cli; do
            echo "::group::cargo package -p $crate --list"
            list="$(cargo package -p "$crate" --list)"
            printf '%s\n' "$list"
            echo "::endgroup::"
            if extra="$(printf '%s\n' "$list" | grep -Ev "$allowed")"; then
              echo "::error::$crate would package files outside the allowlist:"
              printf '%s\n' "$extra"
              exit 1
            fi
            for required in Cargo.toml README.md LICENSE CHANGELOG.md; do
              if ! printf '%s\n' "$list" | grep -xF "$required" >/dev/null; then
                echo "::error::$crate would not package $required"
                exit 1
              fi
            done
          done
      - name: cargo publish --dry-run (library)
        run: cargo publish --dry-run -p fasterhenry
      # `cargo publish --dry-run -p fasterhenry-cli` on its own cannot pass until
      # the library's first real publish: the packaged CLI manifest depends on
      # `fasterhenry = "0.0.1"` from crates.io, and that version is not in the
      # index yet ("no matching package named `fasterhenry` found"). The
      # --workspace form below packages the library first and verifies the CLI
      # against that local package, so the CLI still gets a full verify build.
      # Once the library is on crates.io, a per-crate CLI dry-run works too.
      - name: cargo publish --dry-run (workspace, verifies the CLI against the packaged library)
        run: cargo publish --dry-run --workspace
      - name: Each packaged crate ships a real LICENSE, README and CHANGELOG
        run: |
          set -euo pipefail
          # LICENSE and CHANGELOG.md are symlinks to the workspace root inside
          # each crate directory; check the tarballs hold the files themselves.
          # Start from an empty target/package so the glob below matches exactly
          # the tarball this step builds, never a stale one from an earlier run.
          rm -rf target/package
          cargo package --workspace --no-verify
          for crate in fasterhenry fasterhenry-cli; do
            tarball="$(ls target/package/"$crate"-[0-9]*.crate)"
            root="$(basename "$tarball" .crate)"
            # (no `grep -q`: under pipefail an early exit would SIGPIPE tar)
            tar -xzOf "$tarball" "$root/LICENSE" | grep 'MIT License' >/dev/null
            tar -xzOf "$tarball" "$root/CHANGELOG.md" | grep '^# Changelog$' >/dev/null
            tar -xzOf "$tarball" "$root/README.md" | grep "^# $crate\$" >/dev/null
            echo "$crate: $tarball ok"
          done
