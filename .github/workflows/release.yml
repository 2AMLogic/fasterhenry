name: Release

# Publishes both crates to crates.io when a `v*` tag is pushed, using
# crates.io Trusted Publishing: the job exchanges a GitHub OIDC token for a
# short-lived crates.io token, so no registry secret is stored in the repo.
#
# One-time setup (operator, on crates.io): for each of `fasterhenry` and
# `fasterhenry-cli`, Settings -> Trusted Publishing -> add GitHub
# repository 2AMLogic/fasterhenry, workflow `release.yml`, environment
# `release`. A crate must already exist to configure this, so 0.1.0 was
# published by hand.
#
# Release flow: bump `[workspace.package].version` and the `fasterhenry`
# entry in `[workspace.dependencies]` together, cut the CHANGELOG section,
# merge, then tag the merge commit `vX.Y.Z` and push the tag.
#
# This workflow publishes *source* crates and nothing else: whoever runs
# `cargo install fasterhenry-cli` builds the binary and fetches every
# dependency (with its own license file) themselves, so no artifact published
# here carries someone else's code. Adding a prebuilt artifact — a release
# asset, a container image — changes that, and the four Apache-2.0-only crates
# in the graph then require their license text to travel with it (§4(a)). The
# generated bundle that satisfies this, and the CI guard that fails any
# workflow shipping an artifact without it, are described at the top of
# `tools/third-party-licenses.sh`. Read it before adding an upload step here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish (fasterhenry, fasterhenry-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers / tag rules on this environment gate the publish.
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the on-main ancestry check
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fasterhenry") | .version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi
      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }
      # Idempotent re-runs: publish only the crates whose version is not on
      # crates.io yet (e.g. v0.1.0 was published by hand before this workflow
      # existed; a run that published the library but failed on the CLI
      # resumes with the CLI). 404 means "not published"; any other status
      # (network failure, rate limit, 5xx) fails the job rather than guessing.
      - name: Which crates still need publishing?
        id: check
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pending=""
          # Library first: the CLI's packaged manifest depends on it.
          for crate in fasterhenry fasterhenry-cli; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
              -A 'fasterhenry-release (github.com/2AMLogic/fasterhenry)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "$code" in
              200) echo "::notice::${crate} ${version} is already on crates.io" ;;
              404) pending="${pending} ${crate}" ;;
              *) echo "::error::crates.io returned HTTP ${code} for ${crate} ${version}"; exit 1 ;;
            esac
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io
        if: steps.check.outputs.pending != ''
        id: auth
        # rust-lang/crates-io-auth-action v1.0.5, pinned: it handles the token.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      # Each `cargo publish` waits for its crate to reach the index before
      # returning, so the CLI is published against the just-published library.
      - name: cargo publish
        if: steps.check.outputs.pending != ''
        run: |
          set -euo pipefail
          for crate in ${{ steps.check.outputs.pending }}; do
            cargo publish -p "$crate"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
